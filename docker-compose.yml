version: '3.8'

services:
  # --- Central Kafka Broker (KRaft Mode) ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - kafka-bus

  # --- NETWORK A PAIR ---
  client-a:
    build: ./client
    container_name: client-a
    ports:
      - "${CLIENT_A_PORT:-8001}:8000"
    environment:
      - NETWORK_ID=${NETWORK_A_ID:-network-a}
      - GATEWAY_URL=${GATEWAY_A_INTERNAL_URL:-http://gateway-a:8000}
    networks:
      - net-a

  gateway-a:
    build: ./gateway
    container_name: gateway-a
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - NETWORK_ID=${NETWORK_A_ID:-network-a}
      - CLIENT_URL=${CLIENT_A_INTERNAL_URL:-http://client-a:8000}
    depends_on:
      - kafka
      - client-a
    networks:
      - net-a
      - kafka-bus

  # --- NETWORK B PAIR ---
  client-b:
    build: ./client
    container_name: client-b
    ports:
      - "${CLIENT_B_PORT:-8002}:8000"
    environment:
      - NETWORK_ID=${NETWORK_B_ID:-network-b}
      - GATEWAY_URL=${GATEWAY_B_INTERNAL_URL:-http://gateway-b:8000}
    networks:
      - net-b

  gateway-b:
    build: ./gateway
    container_name: gateway-b
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - NETWORK_ID=${NETWORK_B_ID:-network-b}
      - CLIENT_URL=${CLIENT_B_INTERNAL_URL:-http://client-b:8000}
    depends_on:
      - kafka
      - client-b
    networks:
      - net-b
      - kafka-bus

networks:
  kafka-bus:
    driver: bridge
  net-a:
    driver: bridge
  net-b:
    driver: bridge